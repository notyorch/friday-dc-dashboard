services:
  friday-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: friday-dc-dashboard:local
    container_name: friday-dc-dashboard
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
